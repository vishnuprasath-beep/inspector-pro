name: inspectra_pro_mobile
description: "Smart Asset Inspection, Defect Tracking & Compliance Monitoring Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.1
  geolocator: ^11.0.0
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  sqflite: ^2.3.2
  path: ^1.9.0
  signature: ^5.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
